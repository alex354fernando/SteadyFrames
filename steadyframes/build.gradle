plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '1.0.0'
group = 'com.steadyframes'

base {
    archivesName = 'steadyframes'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Si esta version no existe en el maven de NeoForge, usa otra 21.1.x
    // (la misma que tu instancia, ver pantalla "Mods" del juego).
    version = '21.1.172'

    runs {
        client {
            client()
        }
    }

    mods {
        steadyframes {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
